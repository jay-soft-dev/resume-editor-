<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Resume - Perfect Resume</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .builder-container {
            max-width: 700px;
            margin: 60px auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
        }
        .builder-container h1 {
            font-size: 28px;
            color: #1e1e1e;
            margin-bottom: 10px;
        }
        .builder-container p {
            color: #666;
            margin-bottom: 30px;
        }
        .upload-box {
            border: 2px dashed #6366f1;
            padding: 40px;
            border-radius: 8px;
            background: #f8fafc;
            cursor: pointer;
            transition: 0.3s;
        }
        .upload-box:hover {
            background: #f1f5f9;
        }
        .upload-box input[type="file"] {
            display: none;
        }
        .upload-label {
            font-size: 16px;
            color: #4f46e5;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-back {
            display: inline-block;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
        }
        .btn-back:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="builder-container">
        <h1>Build Your Resume</h1>
        <p>Upload your existing resume in PDF format to get started instantly.</p>
        
        <div class="upload-box" onclick="document.getElementById('resumeFile').click();">
            <input type="file" id="resumeFile" accept=".pdf">
            <div class="upload-label">📁 Click here to upload your PDF resume</div>
            <p style="font-size: 13px; color: #888; margin-top: 8px;" id="fileNameDisplay">Supports PDF format up to 10MB</p>
        </div>

        <br>
        <a href="index.html" class="btn-back">← Back to Home</a>
    </div>

    <script>
        // Optional: Show uploaded file name
        const fileInput = document.getElementById("resumeFile");
        const fileNameDisplay = document.getElementById("fileNameDisplay");

        fileInput.addEventListener("change", (e) => {
            if (e.target.files.length > 0) {
                fileNameDisplay.textContent = "Selected File: " + e.target.files[0].name;
                fileNameDisplay.style.color = "#16a34a";
            }
        });
    </script>

</body>
</html>
